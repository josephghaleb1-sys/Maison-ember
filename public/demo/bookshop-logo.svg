<?xml version="1.0" encoding="UTF-8"?>
<!--
  Demo logo for the "Bookshop" business.

  Purely geometric (no embedded fonts), so it renders identically everywhere.
  Upload it from the dashboard under Website -> Logo & hero image to see it in
  the site header, footer, About page and browser tab. The colors match the
  placeholder palette in supabase/seed/bookshop.sql — edit them here if the
  brand colors change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bookshop">
  <rect width="512" height="512" rx="96" fill="#0E1420"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#C8A44D" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#C8A44D" stroke-width="6"/>

  <g fill="none" stroke="#C8A44D" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open book: two mirrored leaves around a central spine -->
    <path d="M256 214 C 222 194, 186 188, 156 192 L156 296 C 186 292, 222 298, 256 318 Z" stroke-width="11"/>
    <path d="M256 214 C 290 194, 326 188, 356 192 L356 296 C 326 292, 290 298, 256 318 Z" stroke-width="11"/>
    <path d="M256 214 L256 318" stroke-width="9"/>

    <!-- Page lines -->
    <path d="M182 222 C 202 224, 222 230, 238 240" stroke-width="6" opacity="0.6"/>
    <path d="M182 252 C 202 254, 222 260, 238 270" stroke-width="6" opacity="0.6"/>
    <path d="M330 222 C 310 224, 290 230, 274 240" stroke-width="6" opacity="0.6"/>
    <path d="M330 252 C 310 254, 290 260, 274 270" stroke-width="6" opacity="0.6"/>

    <!-- Ribbon bookmark -->
    <path d="M256 318 L256 356" stroke-width="7" opacity="0.8"/>
    <path d="M244 344 L256 358 L268 344" stroke-width="7" opacity="0.8"/>
  </g>
</svg>
